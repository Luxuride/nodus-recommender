---
# The template, not the secret. `kubectl apply` this only to a throwaway
# cluster: the values below are placeholders, and a real deployment gets them
# from a secret manager (sealed-secrets, external-secrets, SOPS).
apiVersion: v1
kind: Secret
metadata:
  name: nodus-secrets
  namespace: nodus
type: Opaque
stringData:
  # One primary, two roles (see docs/02-architecture.md).
  database-url: "postgres://nodus_feeds:REPLACE@postgres.nodus.svc:5432/nodus"
  # 32 random bytes, base64 encoded. Rotating it invalidates every stored
  # token: the calculator treats an unopenable row as revoked and clears it,
  # so rotation is a slow, self-healing sign-out, not an outage.
  token-enc-key: "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8="
