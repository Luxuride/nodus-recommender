[package]
name = "nodus-feeds"
description = "HTTP service exposing the Mastodon recommendation engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
nodus-core = { workspace = true }
nodus-shared = { workspace = true }
nodus-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tower-http = { workspace = true }
base64 = { version = "0.22", features = ["alloc"] }
chacha20poly1305 = { version = "0.11", features = ["alloc"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"] }
sha2 = "0.10"
getrandom = "0.3"
time = { workspace = true }
uuid = { workspace = true }
