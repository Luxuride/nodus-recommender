[package]
name = "nodus-calculator"
description = "Fediverse data ingestion: background sync, job queue, rate limiting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
nodus-core = { workspace = true }
nodus-instance = { workspace = true, features = ["native"] }
nodus-shared = { workspace = true }
nodus-store = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[[bin]]
name = "nodus-calculator"
path = "src/bin/calculator.rs"
[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"
